<!DOCTYPE html>
<!--
    =========================================================================
    popup.html — ツールバーのアイコンを押すと開く「設定画面」の骨組み
    =========================================================================

    ■ このファイルは何をするもの？
        設定画面に並ぶ項目の「並び順と構造」だけを書いたファイルです。
        表示される文字（ラベルや説明文）はここには一切書かれておらず、
        popup.js が起動時に流し込みます。9 言語に対応するための設計です。

    ■ data-* 属性が設定の「配線図」になっている
        この画面には、項目ごとの個別処理を書いた JavaScript がありません。
        代わりに以下の data-* 属性を popup.js が読み取り、自動的に動かします。
        項目を増やしたいときは、ここに 1 行足して shared/schema.js に定義を
        加えるだけで済みます。

        data-key    … この入力欄が担当する設定キー（shared/schema.js の KEYS と対応）
        data-msg    … 要素のテキストに流し込む、多言語ファイルのキー
        data-title  … マウスを乗せたとき出るツールチップの文言キー
        data-href   … リンク先 URL の文言キー（言語ごとにリンク先が異なるため）
        data-hint   … 「1.05 ~ 4.00」のような入力可能範囲の表示先
        data-help   … 「?」ボタンを押したとき出る説明の文言キー
        data-labels … スライダーの目盛りごとのラベル（スペース区切り、左から順）
        data-needs  … ここに挙げた設定がすべて ON のときだけ、その行を操作可能にする
        data-not    … ここに挙げた設定が 1 つでも ON なら、その行を操作不可にする
        data-reset  … 押すとその範囲の設定を初期化するボタン（'site' / 'common'）
        data-site   … そのサイトのタブが選ばれているときだけ表示する要素

    ■ 画面の構造
        ヘッダー（ロゴ＋全体の ON/OFF）
        └ #scopes
            ├ #site   … サイト別設定（YouTube / Twitch / TwitCasting のタブで切り替え）
            └ #common … 全サイト共通設定（画面上のバッジ表示）
        フッター（取扱説明書へのリンク）
-->
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />

    <!--
        読み込む順番に意味があります。
            1. shared/schema.js … 設定の設計図をグローバルの一時変数へ置く
            2. common.js        … それを受け取り、道具箱 SLPSTRM を組み立てる
            3. popup.js         … 道具箱を使って画面を動かす

        defer は「HTML を全部読み終えてから、書いた順に実行する」指定です。
        これがないと、popup.js が実行された時点でまだ <body> の要素が存在せず、
        画面を組み立てられません。
    -->
    <script src="shared/schema.js" defer></script>
    <script src="common.js" defer></script>
    <script src="popup.js" defer></script>

    <!-- popup.js の translate() が、選択中の言語のタイトルへ置き換えます。 -->
    <title>Slipstream Live</title>
</head>
<body>

    <!-- ===================================================================
            ヘッダー：ロゴ・バージョン表示と、拡張機能全体の ON/OFF スイッチ
            =================================================================== -->
    <div id="header">
        <div id="brand">

            <!--
                アイコンをクリックすると公式サイトを開きます。
                target="_blank" は新しいタブで開く指定。
                rel="noopener" はセキュリティ上ほぼ必須の指定で、
                開いた先のページから元のページを操作されるのを防ぎます。
                alt はリンクの名前になります（画像だけのリンクは、これが無いと
                スクリーンリーダーで何のリンクか分からなくなります）。
            -->
            <a id="icon-link" href="https://tail4126.github.io/SlipstreamLive/" target="_blank" rel="noopener">
                <img id="icon" src="./icons/48.png" alt="Slipstream Live" />
            </a>

            <!-- 中身が空なのは、popup.js が文言を流し込むためです（以下すべて同様）。 -->
            <span id="title" data-msg="appShortName"></span>

            <!-- バージョン番号（例: v1.2.0）。manifest.json から読み取って表示します。 -->
            <span id="version"></span>
        </div>

        <!--
            設定 1 行ぶんの基本の形。
            <label> で全体を囲んでいるので、文字の部分をクリックしても
            中のチェックボックスが反応します（押せる範囲が広くなる）。

            ラベルと入力欄の結び付け（for / id）は、popup.js が data-key から自動で行います。
            行の中に「?」ボタンがある場合、結び付けを指定しないと HTML の仕様上
            「ラベル内で最初に現れる操作部品」＝ボタンのほうが操作対象になってしまうためです。
        -->
        <label class="row">
            <span data-msg="enabled"></span>

            <!-- 「全サイト共通の設定です」と示す小さなラベル。 -->
            <small class="chip" data-msg="scopeCommon" data-title="scopeCommonDesc"></small>

            <!-- data-key="enabled" が、この画面で最上位の ON/OFF に対応します。 -->
            <input class="switch" type="checkbox" data-key="enabled" />
        </label>
    </div>

    <!-- ===================================================================
            設定本体：左に「サイト別」、右に「全サイト共通」のパネルを並べる
            =================================================================== -->
    <div id="scopes">

        <!-- ---------------------------------------------------------------
                サイト別設定：選択中のサイト 1 つぶんの設定を表示する
                --------------------------------------------------------------- -->
        <section id="site" class="scope">

            <!--
                サイト切り替えタブの置き場所。中身が空なのは、
                popup.js の buildTabs() が SITES の定義からボタンを生成するためです。
                HTML に直接書かないことで、対応サイトを増やしたときに自動で反映されます。
                role="tablist" は、スクリーンリーダーに「タブの並び」だと伝える指定です。
            -->
            <div id="tabs" class="scope-head" role="tablist"></div>

            <div class="groups">

                <!-- === 加速に関する設定のまとまり === -->
                <div class="group">

                    <!--
                        class="head" が付いた行は、そのまとまりの見出し兼スイッチです。
                        data-needs="enabled" … 全体が ON のときだけ操作できます。
                    -->
                    <label class="row head" data-needs="enabled">
                        <span data-msg="speedup"></span>
                        <button class="help-icon" type="button" data-help="speedupDesc">?</button>
                        <input class="switch" type="checkbox" data-key="speedup" />
                    </label>

                    <!--
                        加速時の再生速度。
                        data-needs="enabled speedup" は「全体が ON」かつ「加速が ON」の
                        両方を満たしたときだけ操作可能、という意味です（スペース区切り）。
                        min / max / step は HTML に書かず、schema.js の range から
                        popup.js が自動で設定します。
                    -->
                    <label class="row" data-needs="enabled speedup">
                        <span><span data-msg="speedupRate"></span> <small class="hint" data-hint="speedupRate"></small></span>
                        <button class="help-icon" type="button" data-help="speedupRateDesc">?</button>
                        <input class="number" type="number" data-key="speedupRate" />
                    </label>

                    <!--
                        手動しきい値。
                        data-not="speedupAuto" … 自動調整が ON（0 以外）のときは、この値が
                        使われないため、行ごとグレーアウトさせます。
                        設定どうしの関係を HTML 側に書いておける、という点がこの仕組みの利点です。
                    -->
                    <label class="row" data-needs="enabled speedup" data-not="speedupAuto">
                        <span data-msg="speedupThreshold"></span>
                        <button class="help-icon" type="button" data-help="speedupThresholdDesc">?</button>
                        <input class="number" type="number" data-key="speedupThreshold" />
                    </label>

                    <!--
                        自動調整の積極度を選ぶスライダー（0〜3 の 4 段階）。
                        data-labels には目盛りの数だけラベルのキーを並べます。
                        左から順に 0, 1, 2, 3 に対応し、つまみを動かすと
                        popup.js の Tip がその位置のラベルを吹き出しで表示します。
                    -->
                    <label class="row" data-needs="enabled speedup">
                        <span data-msg="speedupAuto"></span>
                        <button class="help-icon" type="button" data-help="speedupAutoDesc">?</button>
                        <input class="slider" type="range" data-key="speedupAuto"
                            data-labels="speedupAutoOff speedupAutoStable speedupAutoStandard speedupAutoAggressive" />
                    </label>
                </div>

                <!-- === 下限モード（バッファ切れ寸前の緊急退避）に関する設定 === -->
                <div class="group">
                    <label class="row head" data-needs="enabled">
                        <span data-msg="floor"></span>
                        <button class="help-icon" type="button" data-help="floorDesc">?</button>
                        <input class="switch" type="checkbox" data-key="floor" />
                    </label>

                    <!-- 残量が何秒を切ったら下限モードへ入るか。 -->
                    <label class="row" data-needs="enabled floor">
                        <span data-msg="floorThreshold"></span>
                        <button class="help-icon" type="button" data-help="floorThresholdDesc">?</button>
                        <input class="number" type="number" data-key="floorThreshold" />
                    </label>

                    <!-- 下限モード中に音量を下げるか（超低速時の不快な音を抑えるため）。 -->
                    <label class="row" data-needs="enabled floor">
                        <span data-msg="duck"></span>
                        <button class="help-icon" type="button" data-help="duckDesc">?</button>
                        <input class="switch" type="checkbox" data-key="duck" />
                    </label>

                    <!--
                        下げたときの音量（％）。
                        data-needs に 3 つ並んでいるとおり、「全体」「下限モード」
                        「音量を下げる」がすべて ON のときだけ操作できます。
                    -->
                    <label class="row" data-needs="enabled floor duck">
                        <span><span data-msg="duckVolume"></span> <small class="hint" data-hint="duckVolume"></small></span>
                        <button class="help-icon" type="button" data-help="duckVolumeDesc">?</button>
                        <input class="number" type="number" data-key="duckVolume" />
                    </label>

                    <!--
                        Twitch のタブを選んでいるときだけ表示される注意書き。
                        data-site="twitch" が付いた要素は、他のサイトのタブでは
                        popup.js の render() が hidden 属性を付けて隠します。
                    -->
                    <p class="note" data-site="twitch" data-msg="floorThresholdNote_twitch"></p>
                </div>

                <!--
                    YouTube でしか意味を持たない設定のまとまり。
                    data-site はこのように <div class="group"> にも付けられるので、
                    グループごとまとめて出し分けられます。
                -->
                <div class="group" data-site="youtube">
                    <label class="row" data-needs="enabled">
                        <span data-msg="premiere"></span>
                        <button class="help-icon" type="button" data-help="premiereDesc">?</button>
                        <input class="switch" type="checkbox" data-key="premiere" />
                    </label>
                </div>

                <!-- Twitch でしか意味を持たない設定のまとまり。 -->
                <div class="group" data-site="twitch">
                    <label class="row" data-needs="enabled">
                        <span data-msg="recover"></span>
                        <button class="help-icon" type="button" data-help="recoverDesc">?</button>
                        <input class="switch" type="checkbox" data-key="recover" />
                    </label>
                </div>
            </div>

            <!--
                リセットボタン。
                data-reset="site" は「今表示しているサイトの設定だけを初期化する」指定です。
                ボタンの文字（例:「リセット · YouTube」）は、選択中のサイト名を含むため
                data-msg ではなく popup.js の render() が組み立てて入れます。
            -->
            <div class="footer">
                <button id="reset-site" class="reset" type="button" data-reset="site" data-title="resetDesc"></button>
            </div>
        </section>

        <!-- ---------------------------------------------------------------
                全サイト共通設定：画面上に出すバッジの表示切り替え
                --------------------------------------------------------------- -->
        <section id="common" class="scope">
            <div class="scope-head">
                <span class="chip" data-msg="scopeCommon" data-title="scopeCommonDesc"></span>
            </div>
            <div class="groups">
                <div class="group">

                    <!-- 再生速度バッジ（例: 1.25x）の表示切り替え。 -->
                    <label class="row" data-needs="enabled">
                        <span data-msg="showPlaybackRate"></span>
                        <button class="help-icon" type="button" data-help="showPlaybackRateDesc">?</button>
                        <input class="switch" type="checkbox" data-key="showPlaybackRate" />
                    </label>

                    <!-- 遅延バッジ（例: 1.52s）の表示切り替え。 -->
                    <label class="row" data-needs="enabled">
                        <span data-msg="showLatency"></span>
                        <button class="help-icon" type="button" data-help="showLatencyDesc">?</button>
                        <input class="switch" type="checkbox" data-key="showLatency" />
                    </label>

                    <!-- バッファ残量バッジ（例: 8.32s）の表示切り替え。 -->
                    <label class="row" data-needs="enabled">
                        <span data-msg="showHealth"></span>
                        <button class="help-icon" type="button" data-help="showHealthDesc">?</button>
                        <input class="switch" type="checkbox" data-key="showHealth" />
                    </label>
                </div>
            </div>

            <!--
                共通設定のリセット。
                こちらはサイト名が入らないため、「リセット」と「全サイト共通」の
                2 つの文言を「·」でつないだ形を HTML に直接書けます。
            -->
            <div class="footer">
                <button class="reset" type="button" data-reset="common" data-title="resetDesc"><span data-msg="reset"></span> · <span data-msg="scopeCommon"></span></button>
            </div>
        </section>
    </div>

    <!-- ===================================================================
            フッター：取扱説明書へのリンク
            data-href を使うのは、言語ごとにリンク先の URL が違うためです
            （日本語なら manual.ja.html、英語なら manual.html）。
            =================================================================== -->
    <div id="page-footer">
        <a id="manual-link" data-msg="manual" data-href="manualUrl" target="_blank" rel="noopener"></a>
    </div>
</body>
</html>
